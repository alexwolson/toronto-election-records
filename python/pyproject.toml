[project]
name = "toronto-elections"
version = "0.1.0"
description = "Download, verify and load the Toronto Election Results dataset"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Alex Olson" }]
keywords = ["Toronto", "elections", "Canada", "political science", "dataset"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "pandas>=2.0",
    "platformdirs>=3.0",
    "pyarrow>=14.0",
]

[project.urls]
Homepage = "https://github.com/alexwolson/toronto-election-records"
Issues = "https://github.com/alexwolson/toronto-election-records/issues"

[project.optional-dependencies]
geo = [
    "geopandas>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torontoelections"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "geopandas>=0.14",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
