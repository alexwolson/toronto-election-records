[project]
name = "te-package"
version = "0.1.0"
description = "Builds the Toronto Election Results user package and provenance supplement from one pinned build"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "geopandas>=1.2.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyogrio>=0.13.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "shapely>=2.2.0",
]

[project.scripts]
te-package = "te_package.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/te_package"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
